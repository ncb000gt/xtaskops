[package]
edition = "2021"
name = "xtaskops"
version = "0.5.0"

authors = ["Dotan Nahum <dotan@rng0.io>"]
categories = ["development-tools"]
description = "Goodies for working with the xtask concept"
documentation = "https://docs.rs/xtaskops"
keywords = ["xtask"]
license = "Apache-2.0"
readme = "../README.md"
repository = "https://github.com/jondot/xtaskops"

[features]
clap = ["dep:clap"]
default = ["clap"]

[dependencies]
anyhow = "1"
clap = {version = "4.5.34", optional = true}
derive_builder = "^0.20.2"
dialoguer = "^0.11.0"
duct = "0.13.5"
fs_extra = "1.3.0"
glob = "0.3.0"

[dev-dependencies]
